<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Three Forces Hit Gold at Once</text>
  <!-- Oil box -->
  <rect x="40" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">OIL SHOCK</text>
  <text x="60" y="150" font-size="14" fill="#1a1a1a">Brent neared $117 Fri</text>
  <text x="60" y="175" font-size="14" fill="#1a1a1a">(highest since 2022)</text>
  <text x="60" y="205" font-size="14" fill="#1a1a1a">~$110 on Monday</text>
  <text x="60" y="235" font-size="14" fill="#1a1a1a">US-Iran conflict +</text>
  <text x="60" y="260" font-size="14" fill="#1a1a1a">Houthi attacks on</text>
  <text x="60" y="285" font-size="14" fill="#1a1a1a">Saudi targets</text>
  <!-- Tariff box -->
  <rect x="290" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">TARIFF WHIPLASH</text>
  <text x="310" y="150" font-size="14" fill="#1a1a1a">Oct 23: Canada order</text>
  <text x="310" y="175" font-size="14" fill="#1a1a1a">removes some 50%</text>
  <text x="310" y="200" font-size="14" fill="#1a1a1a">tariffs, adds others</text>
  <text x="310" y="230" font-size="14" fill="#1a1a1a">Oct 17: Russia/Iran</text>
  <text x="310" y="255" font-size="14" fill="#1a1a1a">sanctions act paused</text>
  <text x="310" y="285" font-size="14" fill="#1a1a1a">Changes live Oct 30</text>
  <!-- War box -->
  <rect x="540" y="80" width="220" height="240" fill="#fce4ec" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">WAR GRINDS ON</text>
  <text x="560" y="150" font-size="14" fill="#1a1a1a">Oct 22: heavy strike</text>
  <text x="560" y="175" font-size="14" fill="#1a1a1a">on Kyiv</text>
  <text x="560" y="205" font-size="14" fill="#1a1a1a">157 engagements</text>
  <text x="560" y="230" font-size="14" fill="#1a1a1a">Oct 25</text>
  <text x="560" y="260" font-size="14" fill="#1a1a1a">Trilateral talks</text>
  <text x="560" y="285" font-size="14" fill="#1a1a1a">continue after Nov 10</text>
  <!-- Result bar -->
  <rect x="40" y="350" width="720" height="60" fill="#1a1a1a" rx="12"/>
  <text x="400" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#d4af37">Gold below $4,000 — first time since mid-July</text>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#aaa">GoldRateToday analysis — illustrative, not financial advice</text>
</svg>
