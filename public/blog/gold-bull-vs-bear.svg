  <text x="440" y="225" font-size="15" fill="#1a1a1a">• Geopolitical tensions ease</text>
  <text x="440" y="260" font-size="15" fill="#1a1a1a">• Profit-taking after record run</text>
  <text x="440" y="295" font-size="15" fill="#1a1a1a">• Rising real yields (TIPS)</text>
  <text x="440" y="330" font-size="15" fill="#1a1a1a">• Crypto rotation draws risk capital</text>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#aaa">Source: GoldRateToday analysis — not financial advice</text>
</svg>
