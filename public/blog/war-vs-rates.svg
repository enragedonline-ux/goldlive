<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Why War Isn't Lifting Gold</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">DOLLAR</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">19-month high</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">A strong dollar makes</text>
  <text x="60" y="215" font-size="14" fill="#1a1a1a">gold costlier for</text>
  <text x="60" y="240" font-size="14" fill="#1a1a1a">other buyers.</text>
  <rect x="290" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">DEC HIKE ODDS</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">~94–97%</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">Markets price a near-</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">certain 25bp hike on</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">December 9.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">10Y YIELD</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">~5.10%</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">Bonds pay you to wait;</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">gold pays no yield,</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">so rates win.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Gold pays no yield, so higher rates beat the haven bid.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
