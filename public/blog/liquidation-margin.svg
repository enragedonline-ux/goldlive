  <text x="60" y="240" font-size="14" fill="#1a1a1a">fast.</text>
  <rect x="290" y="80" width="220" height="240" fill="#ffebee" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">MARGIN CALLS</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Gold sold</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">Gold sold for liquidity</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">to meet margin</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">requirements.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">SILVER −5%</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Nov 18</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">Silver fell 5% and</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">copper 5.7% the</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">same day.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Forced selling, not fundamentals.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
