<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">The Liquidation Channel</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">TECH SELLOFF</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Raise cash</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">US tech sell-off forced</text>
