<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Gold's November Slide in Numbers</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">NOV 11 REBOUND</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">$4,057 / oz</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">Recovered after a</text>
  <text x="60" y="215" font-size="14" fill="#1a1a1a">sharp selloff — six</text>
  <text x="60" y="240" font-size="14" fill="#1a1a1a">days before the low.</text>
  <rect x="290" y="80" width="220" height="240" fill="#ffebee" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">NOV 16 LOW</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">$3,830 / oz</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">Lowest since October</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">2025 — a one-year</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">low for spot gold.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">NOV 17 SPOT</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">~$3,875 / oz</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">Trading near $3,875 —</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">about 28% below the</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">January peak of $5,405.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Spot gold, November 2026 — a $227 round trip in six days.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
