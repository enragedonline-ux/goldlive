<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">War Escalates, Gold Slides</text>
  <rect x="40" y="80" width="220" height="240" fill="#ffebee" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">QESHM STRIKE</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Nov 17, 2026</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">US jets hit a Guard</text>
  <text x="60" y="215" font-size="14" fill="#1a1a1a">missile site on</text>
  <text x="60" y="240" font-size="14" fill="#1a1a1a">Qeshm Island.</text>
  <rect x="290" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">HORMUZ</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tankers hit</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">Tankers attacked and</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">mined; shipping</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">through the strait</text>
  <text x="310" y="265" font-size="14" fill="#1a1a1a">at risk.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">GOLD</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Below $3,800</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">A 14-month low —</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">first break of $3,800</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">since September 2025.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">War up, gold down — the dollar and the Fed are winning.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
