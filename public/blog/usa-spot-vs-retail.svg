<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Spot vs US Retail</text>
  <rect x="40" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">SPOT</text>
  <text x="60" y="150" font-size="14" fill="#1a1a1a">About $4,005 per troy</text>
  <text x="60" y="175" font-size="14" fill="#1a1a1a">ounce. The wholesale</text>
  <text x="60" y="200" font-size="14" fill="#1a1a1a">benchmark — nobody</text>
  <text x="60" y="225" font-size="14" fill="#1a1a1a">pays exactly this.</text>
  <rect x="290" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">RETAIL PREMIUM</text>
  <text x="310" y="150" font-size="14" fill="#1a1a1a">Minting, distribution,</text>
  <text x="310" y="175" font-size="14" fill="#1a1a1a">dealer margin and</text>
  <text x="310" y="200" font-size="14" fill="#1a1a1a">shipping sit on top</text>
  <text x="310" y="225" font-size="14" fill="#1a1a1a">of spot for coins.</text>
  <rect x="540" y="80" width="220" height="240" fill="#fce4ec" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">14K JEWELRY</text>
  <text x="560" y="150" font-size="14" fill="#1a1a1a">14K is the most common</text>
  <text x="560" y="175" font-size="14" fill="#1a1a1a">US jewelry gold, at</text>
  <text x="560" y="200" font-size="14" fill="#1a1a1a">58.5% purity. 10K is</text>
  <text x="560" y="225" font-size="14" fill="#1a1a1a">the US legal minimum.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Compare any US quote against live spot before judging whether it is fair.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
