<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Divided Government, Gold and the Dollar</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">GRIDLOCK</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Spending stalls</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">Tax and spending plans</text>
  <text x="60" y="215" font-size="14" fill="#1a1a1a">now face a Congress</text>
  <text x="60" y="240" font-size="14" fill="#1a1a1a">the other party holds.</text>
  <rect x="290" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">FED IN FOCUS</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Oversight rises</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">A Democratic Congress</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">can challenge pressure</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">on the Fed.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">GOLD'S DRIVERS</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Rates + dollar</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">Gold's near-term path</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">is still set by the Fed</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">and the dollar.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">The December 8–9 FOMC still decides gold's next move.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
