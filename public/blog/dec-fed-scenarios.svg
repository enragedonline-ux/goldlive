<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Three Scenarios for Gold</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">HIKE AS EXPECTED</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Muted reaction</text>
  <text x="60" y="185" font-size="14" fill="#1a1a1a">25bp is priced in —</text>
  <text x="60" y="210" font-size="14" fill="#1a1a1a">watch the press</text>
  <text x="60" y="235" font-size="14" fill="#1a1a1a">conference, not the</text>
  <text x="60" y="260" font-size="14" fill="#1a1a1a">statement.</text>
  <rect x="290" y="80" width="220" height="240" fill="#ffebee" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">HAWKISH SURPRISE</text>
  <text x="400" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Below $3,830</text>
  <text x="310" y="185" font-size="14" fill="#1a1a1a">A 50bp hike, or dots</text>
  <text x="310" y="210" font-size="14" fill="#1a1a1a">pointing to more</text>
  <text x="310" y="235" font-size="14" fill="#1a1a1a">tightening in 2027.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">DOVISH SURPRISE</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Toward $4,000</text>
  <text x="560" y="185" font-size="14" fill="#1a1a1a">A hold, or a signal</text>
  <text x="560" y="210" font-size="14" fill="#1a1a1a">December was the last</text>
  <text x="560" y="235" font-size="14" fill="#1a1a1a">move — gold breathes.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Scenarios the market is pricing — none is a forecast.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Not financial advice.</text>
</svg>
