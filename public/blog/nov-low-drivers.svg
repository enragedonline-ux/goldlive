<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Three Forces Pressing Gold</text>
  <rect x="40" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">STRONG DOLLAR</text>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">19-month high</text>
  <text x="60" y="190" font-size="14" fill="#1a1a1a">A stronger dollar</text>
  <text x="60" y="215" font-size="14" fill="#1a1a1a">makes gold pricier</text>
  <text x="60" y="240" font-size="14" fill="#1a1a1a">for non-dollar buyers.</text>
  <rect x="290" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">TREASURY YIELDS</text>
  <text x="400" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">2Y 4.87% / 10Y 5.14%</text>
  <text x="310" y="190" font-size="14" fill="#1a1a1a">Safe bonds pay; gold</text>
  <text x="310" y="215" font-size="14" fill="#1a1a1a">pays nothing — the</text>
  <text x="310" y="240" font-size="14" fill="#1a1a1a">cost of holding rises.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">DEC HIKE ODDS</text>
  <text x="650" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">90–97% for 25bp</text>
  <text x="560" y="190" font-size="14" fill="#1a1a1a">Hot Oct CPI +0.4%,</text>
  <text x="560" y="215" font-size="14" fill="#1a1a1a">PPI +6.5% y/y — the</text>
  <text x="560" y="240" font-size="14" fill="#1a1a1a">largest in four years.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">All three pointed the same way in November 2026.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
