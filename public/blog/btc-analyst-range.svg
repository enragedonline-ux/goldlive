<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Analyst Scenarios for 2027: A Wide Range</text>
  <!-- Range bar -->
  <rect x="60" y="110" width="680" height="50" fill="#e0e0e0" rx="25"/>
  <rect x="60" y="110" width="680" height="50" fill="none" stroke="#1a1a1a" stroke-width="1" rx="25"/>
  <text x="90" y="142" font-size="16" font-weight="700" fill="#c62828">Fresh lows</text>
  <text x="710" y="142" text-anchor="end" font-size="16" font-weight="700" fill="#2e7d32">Above $150,000</text>
  <!-- Middle note -->
  <rect x="140" y="200" width="520" height="120" fill="#fff3e0" rx="12"/>
  <text x="400" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">No single reliable number</text>
  <text x="400" y="275" text-anchor="middle" font-size="15" fill="#1a1a1a">Treat any target as a scenario, not a prediction</text>
  <!-- Drivers -->
  <text x="400" y="370" text-anchor="middle" font-size="15" fill="#1a1a1a">Watch the drivers: rates, ETF flows, regulation, halving cycle</text>
  <!-- Result bar -->
  <rect x="40" y="395" width="720" height="50" fill="#1a1a1a" rx="12"/>
  <text x="400" y="427" text-anchor="middle" font-size="17" font-weight="700" fill="#d4af37">Watch the assumption, not the headline target</text>
  <text x="400" y="465" text-anchor="middle" font-size="12" fill="#aaa">GoldRateToday analysis — illustrative, not financial advice</text>
</svg>
