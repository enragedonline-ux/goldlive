<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#FAF8F2" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">ARS Gold = Spot x FX</text>
  <rect x="40" y="80" width="220" height="240" fill="#fff3e0" rx="12"/>
  <text x="150" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#e65100">SPOT</text>
  <text x="60" y="150" font-size="14" fill="#1a1a1a">About $4,005 per troy</text>
  <text x="60" y="175" font-size="14" fill="#1a1a1a">ounce in dollars, set</text>
  <text x="60" y="200" font-size="14" fill="#1a1a1a">on the global market,</text>
  <text x="60" y="225" font-size="14" fill="#1a1a1a">not in Buenos Aires.</text>
  <rect x="290" y="80" width="220" height="240" fill="#e3f2fd" rx="12"/>
  <text x="400" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">FX</text>
  <text x="310" y="150" font-size="14" fill="#1a1a1a">About 1,540 pesos per</text>
  <text x="310" y="175" font-size="14" fill="#1a1a1a">dollar. When the peso</text>
  <text x="310" y="200" font-size="14" fill="#1a1a1a">weakens, every peso</text>
  <text x="310" y="225" font-size="14" fill="#1a1a1a">price rises with it.</text>
  <rect x="540" y="80" width="220" height="240" fill="#e8f5e9" rx="12"/>
  <text x="650" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d32">ARS GOLD</text>
  <text x="560" y="150" font-size="14" fill="#1a1a1a">About 198,000 pesos</text>
  <text x="560" y="175" font-size="14" fill="#1a1a1a">per gram (24K) and</text>
  <text x="560" y="200" font-size="14" fill="#1a1a1a">about 6.18 million</text>
  <text x="560" y="225" font-size="14" fill="#1a1a1a">per ounce today.</text>
  <text x="400" y="380" text-anchor="middle" font-size="15" fill="#666">Two dials move the Argentine price: the world spot and the peso.</text>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#666">Illustrative, not financial advice.</text>
</svg>
